<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Accreditations</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: #f9f9f9; color: #444; padding: 40px 20px; }
        h1 { text-align: center; font-size: 2.5rem; color: #333; margin-bottom: 20px; }
        .back-button { display: inline-block; padding: 12px 24px; background-color: #2d87f0; color: white; text-decoration: none; font-weight: 600; border-radius: 50px; margin-bottom: 30px; text-align: center; }
        .back-button:hover { background-color: #2163d1; }
        .certificate-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; justify-items: center; }
        .certificate-card { background-color: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); padding: 20px; text-align: center; max-width: 280px; }
        .certificate-card img { width: 200px; height: auto; margin-bottom: 20px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-button">Back</a>
    <h1>Accreditations</h1>

    <div class="certificate-container">
        <!-- Thyrocare Logo -->
        <div class="certificate-card">
            <img src="https://www.thyrocare.com/images/logo.png" alt="Thyrocare Logo">
        </div>

        <!-- Redcliffe Labs Logo -->
        <div class="certificate-card">
            <img src="https://via.placeholder.com/200x100?text=Redcliffe+Labs+Logo" alt="Redcliffe Labs Logo">
        </div>
    </div>

</body>
</html>

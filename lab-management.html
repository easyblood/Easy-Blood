<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy Blood — Lab Management</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}input,button,textarea{padding:11px;border:1px solid #ccd3df;border-radius:9px;font-size:15px}input,textarea{width:100%;box-sizing:border-box;margin:5px 0 10px}button{background:#1769e0;color:#fff;border:0;cursor:pointer;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hidden{display:none}.brand{font-size:28px;font-weight:700}.muted{color:#667085}.result{border:1px solid #e1e5ec;padding:10px;border-radius:10px;margin:8px 0}.danger{color:#b42318}.ok{color:#067647}</style></head><body><div class="wrap"><div class="brand">EASY BLOOD</div><div class="muted">Lab Management System</div><section id="login" class="card"><h2>Management Login</h2><input id="login_id" placeholder="Login ID" value="easyblood"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><button onclick="logout()">Logout</button><button onclick="loadReports()">Refresh Reports</button><h2>Create Patient & Report</h2><div class="grid"><input id="name" placeholder="Patient name"><input id="age" placeholder="Age"><input id="gender" placeholder="Gender"><input id="mobile" placeholder="Mobile"><input id="test" placeholder="Test name"></div><h3>Results</h3><div id="results"></div><button onclick="addResult()">+ Add Test Result</button><br><button onclick="createReport()">Create Report</button><p id="out"></p></div><div class="card"><h2>Reports</h2><input id="search" placeholder="Search patient / report ID" oninput="loadReports()"><div id="reports"></div></div></section></div><script>let token='';const $=id=>document.getElementById(id);function addResult(p='',v='',u='',r=''){const d=document.createElement('div');d.className='result';d.innerHTML=`<input placeholder="Parameter" value="${p}"><input placeholder="Result" value="${v}"><input placeholder="Unit" value="${u}"><input placeholder="Reference range" value="${r}">`;$("results").appendChild(d)}addResult();async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(url,opt)}async function login(){const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login_id:$('login_id').value,password:$('password').value})});const x=await res.json();if(!res.ok){$('msg').textContent=x.error||'Login failed';return}token=x.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');loadReports()}function logout(){token='';location.reload()}async function createReport(){const result=[...document.querySelectorAll('#results .result')].map(d=>{let i=d.querySelectorAll('input');return{parameter:i[0].value,value:i[1].value,unit:i[2].value,reference:i[3].value}}).filter(x=>x.parameter);const body={patient_name:$('name').value,age:$('age').value,gender:$('gender').value,mobile:$('mobile').value,test_name:$('test').value,result};const res=await api('/api/reports',{method:'POST',body:JSON.stringify(body)});const x=await res.json();$('out').innerHTML=res.ok?`Report created: <b>${x.report_id}</b><br><a href="${x.verify_url}" target="_blank">Patient verification page</a>`:`<span class="danger">${x.error}</span>`;loadReports()}async function loadReports(){if(!token)return;const q=encodeURIComponent($('search').value||'');const res=await api('/api/reports?q='+q);if(!res.ok)return;const rows=await res.json();$('reports').innerHTML=rows.map(r=>`<div class="result"><b>${r.report_id}</b> — ${r.patient_name} — ${r.test_name} — ${r.report_date}<br>${r.pdf_url?`<a href="${r.pdf_url}" target="_blank">Open PDF</a>`:`<button onclick="pdf('${r.report_id}')">Generate PDF + QR</button>`}</div>`).join('')||'No reports yet.'}async function pdf(id){const res=await api('/api/reports/'+id+'/generate-pdf',{method:'POST'});const x=await res.json();if(res.ok)window.open(x.pdf_url,'_blank');else alert(x.error||'PDF failed');loadReports()}</script></body></html>
